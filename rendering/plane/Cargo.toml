[package]
name = "plane-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Draws the 787 tour: pixel art scenes, exploded 3D parts and glowing system flows, into a framebuffer for the page."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
