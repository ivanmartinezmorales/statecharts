<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pip and the Fallen Star</title>
  <meta name="description" content="A pixel-art bedtime story you can step through: Pip the bear helps a fallen star get home.">
  <meta name="theme-color" content="#140c22">
  <link rel="canonical" href="https://pip-and-the-fallen-star.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pip and the Fallen Star">
  <meta property="og:url" content="https://pip-and-the-fallen-star.vercel.app/">
  <meta property="og:title" content="Pip and the Fallen Star">
  <meta property="og:description" content="A pixel-art bedtime story you can step through, with forks in the path and two endings. On every path, Twinkle the star gets home.">
  <meta property="og:image" content="https://pip-and-the-fallen-star.vercel.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A pixel-art bedroom at night: a teddy bear on the windowsill and a fallen star glowing at the window.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pip and the Fallen Star">
  <meta name="twitter:description" content="A pixel-art bedtime story you can step through, with forks in the path and two endings.">
  <meta name="twitter:image" content="https://pip-and-the-fallen-star.vercel.app/og.png">
  <meta name="twitter:image:alt" content="A pixel-art bedroom at night: a teddy bear on the windowsill and a fallen star glowing at the window.">
  <link rel="icon" href="fallen-star/sky.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1 id="title">Pip and the Fallen Star</h1>
      <p id="tagline"></p>
    </header>

    <figure class="stage">
      <div class="drift">
        <canvas id="scene" width="240" height="160" role="img" aria-label=""></canvas>
        <canvas id="glow" aria-hidden="true"></canvas>
      </div>
    </figure>

    <section class="page" aria-live="polite">
      <h2 id="state-label"></h2>
      <p id="state-text"></p>
    </section>

    <nav id="choices" aria-label="What happens next"></nav>

    <section class="map">
      <h3>The whole story</h3>
      <p class="hint">Each picture is a state. Each arrow is something that happens. Tap a picture next to yours to go there.</p>
      <svg id="map" viewBox="0 0 420 240" role="img" aria-label="A map of the story as a statechart"></svg>
    </section>

    <section class="rules">
      <h3>Checked rules</h3>
      <p class="hint" id="checked"></p>
      <ul id="rules"></ul>
    </section>

    <footer>
      <button id="restart" type="button">Start over</button>
      <p>Drawn in code, pixel by pixel. Checked with <a href="https://github.com/tlaplus/tlaplus">TLC</a> through the statechart skill from <a href="https://github.com/cursor/plugins/tree/main/pstack">pstack</a>.</p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
